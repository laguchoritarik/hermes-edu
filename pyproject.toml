[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "hermes-edu"
version = "0.1.0"
description = "Provider-agnostic, MCP-enabled, LangGraph-orchestrated educational content agent."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["education", "agents", "mcp", "langgraph", "rag", "latex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "mcp>=2,<3",
  "openai>=3.19,<4",
  "platformdirs>=4,<5",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.15,<3",
  "structlog>=26,<27",
  "tenacity>=9,<10",
]

[project.scripts]
hermes-edu = "hermes_edu.interfaces.cli.app:app"
hermes-edu-mcp = "hermes_edu.mcp.server:main"

[project.optional-dependencies]
cli = [
  "rich>=14,<15",
  "typer>=0.27,<1",
]
rag = [
  "hnswlib>=0.8,<0.9",
  "numpy>=2,<3",
  "pymupdf>=1.28,<2",
  "sqlite-vec>=0.1.9,<0.2",
]
latex = [
  "jinja2>=3.1,<4",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
browser = [
  "playwright>=1.57,<2",
]
langchain = [
  "langchain>=1,<2",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mcp[cli]>=2,<3",
  "pip-audit>=2.9,<3",
  "pre-commit>=4,<5",
  "pyright>=1.1,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.10,<1",
]
docs = [
  "mkdocs-material>=9,<10",
  "mkdocstrings[python]>=0.29,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["hermes_edu"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
