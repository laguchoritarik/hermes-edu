name: Feature request
description: Propose a capability or architecture improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user/developer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: architecture
    attributes:
      label: Architecture impact
      description: Which layer/port/adapter changes? Is an ADR needed?
